<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compton scattering · 2D to 3D</title><style>
:root{color-scheme:light;--ink:#182d42;--muted:#5b6f83;--line:#dce5ec;--gold:#a86c08;--cyan:#007c96;--purple:#7352b3;--electron:#b34567}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:19px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:1px solid #bfcfdb;border-radius:7px;background:white;color:var(--ink);padding:8px 14px;cursor:pointer}button:hover{background:#edf4f8}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--ink);color:white}input[type=range]{accent-color:var(--purple);min-width:120px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 25px 9px}h1{font-size:27px;margin:0}nav{display:flex;gap:9px}.stepbar{display:flex;gap:15px;align-items:center;padding:8px 25px 10px;border-bottom:1px solid var(--line)}#step-title{font-weight:650;font-size:23px}#stage-count{font-variant-numeric:tabular-nums;color:var(--muted)}.canvas-wrap{position:relative;height:clamp(300px,calc(100dvh - 322px),850px);min-height:280px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.math-label{position:absolute;white-space:nowrap;font-size:27px;line-height:1;background:none;text-shadow:0 0 6px white,0 0 6px white}#stage-message{position:absolute;bottom:9px;left:25px;right:25px;text-align:center;color:var(--muted);font-size:19px;pointer-events:none}#readout{position:absolute;right:26px;top:14px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums;font-size:20px;pointer-events:none}#readout div{display:flex;gap:12px;justify-content:space-between}.controls{border-top:1px solid var(--line);padding:10px 25px 16px;display:flex;gap:14px 22px;flex-wrap:wrap;align-items:center}.controls label{display:inline-flex;align-items:center;gap:8px}.controls .beta-control{flex:1;min-width:280px}.beta-control input{flex:1}.energy-input{width:100px;border:1px solid #bdccd7;border-radius:5px;padding:4px 7px}output{font-variant-numeric:tabular-nums}.legend{display:flex;flex-wrap:wrap;gap:8px 24px;padding:4px 25px 10px;font-size:18px}.legend > span{display:flex;gap:7px;align-items:center}.dot{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}.legend .small{color:var(--muted);font-size:16px}.hidden{display:none!important}#equation{color:var(--purple);margin-left:auto}#phi-slider{width:145px}#error{padding:20px;color:#a12e45}#help{color:var(--muted);font-size:15px;padding:0 25px 10px}button:focus-visible,input:focus-visible{outline:3px solid #2d86c3;outline-offset:2px}@media(max-width:900px){header{padding:10px 16px}h1{font-size:22px}.stepbar{padding:7px 16px}#step-title{font-size:20px}#readout{right:15px;font-size:17px}.canvas-wrap{height:calc(100dvh - 380px)}.controls{padding:9px 16px;gap:8px 14px;font-size:17px}.legend{padding:5px 16px;font-size:16px}#equation{margin-left:0}#stage-message{font-size:17px;left:12px;right:12px}}@media(max-width:550px){nav button{padding:6px 9px;font-size:16px}h1{font-size:19px}.stepbar{flex-wrap:wrap;gap:8px}#step-title{order:3;flex-basis:100%}.canvas-wrap{height:340px}.controls .beta-control{min-width:100%;}.legend .small{font-size:14px}#readout{font-size:15px}#stage-message{font-size:15px}}
</style></head><body><header><h1 data-t="title"></h1><nav><button id="language">English</button><button id="fullscreen" data-t="fullscreen"></button></nav></header>
<section class="stepbar"><button id="previous" data-t="previous"></button><button id="next" class="primary" data-t="next"></button><span id="stage-count"></span><span id="step-title"></span><button id="reset-view" style="margin-left:auto" data-t="resetView"></button></section>
<main><div class="canvas-wrap" id="view" tabindex="0" aria-label="Interactive Compton scattering"><div id="labels"></div><div id="readout"><div><span data-tex="E"></span><span id="read-energy"></span></div><div id="deposit-1"><span data-tex="E_1"></span><span id="read-e1"></span></div><div id="deposit-2"><span data-tex="E_2=E'"></span><span id="read-e2"></span></div><div id="angle-readout"><span data-tex="\arccos(\boldsymbol{n}\cdot\boldsymbol{k})"></span><span id="read-angle"></span></div></div><div id="stage-message"></div></div>
<div class="legend"><span><i class="dot" style="--c:#b27a0b"></i><span data-t="incident"></span></span><span><i class="dot" style="--c:#007c96"></i><span data-t="scattered"></span></span><span><i class="dot" style="--c:#b34567"></i><span data-t="recoil"></span></span><span><i class="dot" style="--c:#7352b3"></i><span data-t="circle"></span></span><span id="equation" data-tex="\boldsymbol{a}=-\boldsymbol{k}\quad\boldsymbol{s}\cdot\boldsymbol{a}=\cos\varphi"></span></div>
<section class="controls"><label><span data-tex="E"></span><input class="energy-input" id="energy" type="number" min="10" max="10000" step="10" value="1000" aria-label="Incident energy (keV)">keV</label><label><span data-tex="\varphi"></span><input id="phi-slider" type="range" min="5" max="175" step="1" value="55" aria-label="Compton scattering angle"><output id="phi-value">55°</output></label><label class="beta-control"><span data-t="candidate"></span><span data-tex="\beta"></span><input id="beta-slider" type="range" min="0" max="360" step=".5" value="0" aria-label="Candidate direction rotation"><output id="beta-value">0°</output></label><button id="sweep" data-t="sweep"></button><label><input type="checkbox" id="electron" checked><span data-t="showElectron"></span></label><label><input type="checkbox" id="cone" checked><span data-t="showCone"></span></label></section><div id="help" data-t="help"></div><div id="error" role="alert" hidden></div></main><script>/*__APP_BUNDLE__*/</script></body></html>
